# =============================================================================
# CI — Integração Contínua do SMC Lab
# =============================================================================
# Este workflow roda automaticamente a cada push e em cada Pull Request.
# Garante que o código está funcionando antes de fazer merge.
# =============================================================================

name: CI

# `push` em todas as branches somava-se ao `pull_request`, rodando o mesmo
# commit duas vezes. Ficam as branches que existem sem PR (o fluxo é: branch de
# trabalho -> merge em `dev` -> PR de `dev` para `main`); o resto é coberto pelo
# evento de PR.
on:
  push:
    branches: [main, dev]
  pull_request:

# Permite cancelar execuções duplicadas (ex: vários pushes rápidos)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Versão fixa e igual à do .pre-commit-config.yaml e do
      # requirements-dev.txt. Com `pip install ruff` (latest) o CI reprovava
      # formatação que o hook local tinha acabado de aprovar.
      - name: Instalar Ruff
        run: pip install ruff==0.15.2

      - name: Rodar Ruff (check)
        run: ruff check .

      - name: Rodar Ruff (format --check)
        run: ruff format --check .


  compat-producao:
    name: Compatibilidade com o Python de producao
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # A imagem de producao (playwright v1.49.0-jammy, Ubuntu 22.04) roda
      # Python 3.10, enquanto o resto do CI roda 3.13. Codigo com sintaxe ou
      # simbolos de 3.11+ passava por toda a suite e so quebrava no servidor -
      # foi o que derrubou o worker em loop de restart com `from datetime import
      # UTC`, enquanto o site seguia no ar, escondendo a falha.
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10 (mesma versão do container)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Mesma lista que a trava do Dockerfile: `scripts/check_runtime_imports.py`.
      # Antes eram duas cópias, e a daqui tinha ficado para trás.
      - name: Importar os módulos de runtime
        env:
          DJANGO_SETTINGS_MODULE: trader_portal.settings.ci
        run: python scripts/check_runtime_imports.py

  test:
    name: Testes
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout — baixa o código do repositório
      # -----------------------------------------------------------------------
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Setup Python — instala a versão correta do Python
      # -----------------------------------------------------------------------
      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"  # Reutiliza cache de pacotes entre execuções

      # -----------------------------------------------------------------------
      # 3. Instalar dependências
      # -----------------------------------------------------------------------
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Aspas obrigatórias: sem elas o bash lê `>` como redirecionamento,
          # cria um arquivo chamado `=7.0.0` e instala o coverage que vier.
          pip install "coverage[toml]>=7.0.0"

      # -----------------------------------------------------------------------
      # 4. Validar configuração do Django
      # -----------------------------------------------------------------------
      - name: Verificar configuração (manage.py check)
        env:
          DJANGO_SETTINGS_MODULE: trader_portal.settings.ci
        run: python manage.py check

      # -----------------------------------------------------------------------
      # 5. Verificar migrações (nenhuma pendente)
      # -----------------------------------------------------------------------
      - name: Verificar migrações (makemigrations --check)
        env:
          DJANGO_SETTINGS_MODULE: trader_portal.settings.ci
        run: python manage.py makemigrations --check

      # -----------------------------------------------------------------------
      # 6. Rodar testes com cobertura (mínimo 70%)
      # -----------------------------------------------------------------------
      - name: Executar testes com cobertura
        env:
          DJANGO_SETTINGS_MODULE: trader_portal.settings.ci
        run: |
          coverage run manage.py test --verbosity=2
          coverage report --fail-under=70


  test-postgres:
    name: Testes com PostgreSQL e check de producao
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # A suíte principal roda em SQLite em memória, que é rápido mas esconde o
    # que só existe no Postgres: constraint parcial (`UniqueConstraint` com
    # `condition`), `select_for_update`, precisão de Decimal, ordenação e
    # timezone. A constraint de `discord_user_id` da Fase 4 teve que ser
    # validada contra Postgres na mão, fora do CI, justamente por isto.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes contra PostgreSQL 16
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
        run: python manage.py test --settings=trader_portal.settings.ci_postgres

      # `prod.py` nunca era importado pelo CI: um typo lá só aparecia no deploy,
      # com o site fora. As variáveis são de mentira — o check não abre conexão.
      # `--fail-level WARNING` porque hoje a saída é limpa: qualquer aviso novo
      # é regressão de configuração de segurança.
      - name: Validar settings de produção (check --deploy)
        env:
          DJANGO_SETTINGS_MODULE: trader_portal.settings.prod
          DJANGO_SECRET_KEY: chave-de-mentira-so-para-o-check-com-mais-de-50-caracteres-aleatorios
          DJANGO_ALLOWED_HOSTS: smclab.com.br
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
        run: python manage.py check --deploy --fail-level WARNING
