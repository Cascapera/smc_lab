# =============================================================================
# CI — Integração Contínua do SMC Lab
# =============================================================================
# Este workflow roda automaticamente a cada push e em cada Pull Request.
# Garante que o código está funcionando antes de fazer merge.
# =============================================================================

name: CI

# Quando o workflow deve ser executado (todas as branches)
on:
  push:
  pull_request:

# Permite cancelar execuções duplicadas (ex: vários pushes rápidos)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar Ruff
        run: pip install ruff

      - name: Rodar Ruff (check)
        run: ruff check .

      - name: Rodar Ruff (format --check)
        run: ruff format --check .


  compat-producao:
    name: Compatibilidade com o Python de producao
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # A imagem de producao (playwright v1.49.0-jammy, Ubuntu 22.04) roda
      # Python 3.10, enquanto o resto do CI roda 3.13. Codigo com sintaxe ou
      # simbolos de 3.11+ passava por toda a suite e so quebrava no servidor -
      # foi o que derrubou o worker em loop de restart com `from datetime import
      # UTC`, enquanto o site seguia no ar, escondendo a falha.
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10 (mesma versão do container)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Importar os módulos que o Celery carrega
        env:
          DJANGO_SETTINGS_MODULE: trader_portal.settings.ci
        run: |
          python -c "
          import django; django.setup()
          import macro.tasks, macro.services.network, macro.services.collector, macro.services.retention
          import trades.tasks, trades.services.analytics_ia
          import accounts.tasks, discord_integration.tasks
          import payments.services.plans, payments.services.mercadopago
          import sys; print('ok em', sys.version.split()[0])
          "

  test:
    name: Testes
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout — baixa o código do repositório
      # -----------------------------------------------------------------------
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Setup Python — instala a versão correta do Python
      # -----------------------------------------------------------------------
      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"  # Reutiliza cache de pacotes entre execuções

      # -----------------------------------------------------------------------
      # 3. Instalar dependências
      # -----------------------------------------------------------------------
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage[toml]>=7.0.0

      # -----------------------------------------------------------------------
      # 4. Validar configuração do Django
      # -----------------------------------------------------------------------
      - name: Verificar configuração (manage.py check)
        env:
          DJANGO_SETTINGS_MODULE: trader_portal.settings.ci
        run: python manage.py check

      # -----------------------------------------------------------------------
      # 5. Verificar migrações (nenhuma pendente)
      # -----------------------------------------------------------------------
      - name: Verificar migrações (makemigrations --check)
        env:
          DJANGO_SETTINGS_MODULE: trader_portal.settings.ci
        run: python manage.py makemigrations --check

      # -----------------------------------------------------------------------
      # 6. Rodar testes com cobertura (mínimo 70%)
      # -----------------------------------------------------------------------
      - name: Executar testes com cobertura
        env:
          DJANGO_SETTINGS_MODULE: trader_portal.settings.ci
        run: |
          coverage run manage.py test --verbosity=2
          coverage report --fail-under=70
