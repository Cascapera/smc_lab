# =============================================================================
# CD — Entrega Contínua do SMC Lab
# =============================================================================
# Deploy manual para Lightsail: Actions → Deploy → Run workflow.
# Requer: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, DEPLOY_PATH
# =============================================================================

name: Deploy

on:
  workflow_dispatch:  # Manual: Actions → Deploy → Run workflow
  # Descomente abaixo quando quiser deploy automático a cada push na main:
  # push:
  #   branches: [main]

# Só um deploy por vez
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy para Lightsail
    runs-on: ubuntu-latest
    # Opcional: descomente para exigir aprovação antes do deploy
    # environment: production

    steps:
      # Falha aqui, antes de tocar em qualquer coisa, se faltar o known_hosts.
      # Sem ele o passo seguinte não tem como validar a identidade do servidor,
      # e a alternativa antiga (aceitar quem responder) é justamente o que
      # estamos removendo.
      - name: Conferir os secrets obrigatórios
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "ERRO: o secret SSH_KNOWN_HOSTS nao esta definido."
            echo ""
            echo "Gere o valor numa maquina que ja confia no servidor:"
            echo "    ssh-keyscan -t ed25519 <SSH_HOST>"
            echo ""
            echo "Confira a impressao digital contra a do proprio servidor:"
            echo "    ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub"
            echo ""
            echo "E cole a saida do ssh-keyscan em Settings -> Secrets -> SSH_KNOWN_HOSTS."
            exit 1
          fi

      # `StrictHostKeyChecking=no` + `ssh-keyscan || true` entregavam a chave
      # privada de deploy para qualquer host que respondesse naquele endereço: o
      # keyscan aceitava a chave apresentada na hora, sem nada com que comparar.
      # Agora a chave do servidor vem de um secret e o ssh recusa o que não bater.
      - name: Configurar SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -o pipefail
          saida="$(mktemp)"
          # O script é gravado num ARQUIVO no servidor e só então executado.
          #
          # Com `bash -s` ele chegava pelo stdin, e qualquer comando lá dentro
          # que leia stdin engole o resto dele. Foi o que aconteceu na estreia
          # deste workflow: o `docker compose run` do backup de media (sem `-T`)
          # consumiu o restante do script, o bash chegou ao EOF e saiu com
          # código 0. Deploy verde que parou no backup, sem subir nada — o site
          # continuou no ar com a versão antiga e ninguém teria notado.
          #
          # Gravar em arquivo resolve a classe inteira: o `cat` consome o stdin
          # de propósito, e o script roda depois, com stdin já em EOF.
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${SSH_USER}@${SSH_HOST}" \
            "cat > /tmp/smc_deploy.sh && DEPLOY_PATH='${DEPLOY_PATH}' bash /tmp/smc_deploy.sh" <<'REMOTE' | tee "$saida"
          set -euo pipefail

          # O secret pode estar gravado com `~` no comeco. Entre aspas o bash nao
          # expande til, e sem aspas um caminho com espaco quebraria - entao a
          # expansao e feita aqui, de propósito e uma vez so. `~app/...` (sem a
          # barra) nao e til de usuario nenhum e continua sendo o caminho
          # relativo que ja e hoje.
          destino="${DEPLOY_PATH:-$HOME/app}"
          case "$destino" in "~/"*) destino="$HOME/${destino#\~/}" ;; esac
          cd "$destino"
          echo ">>> Diretorio: $(pwd)"

          # O passo seguinte faz `git reset --hard`. Se o DEPLOY_PATH estiver
          # errado, ele destroi o que houver na pasta em que caiu - conferir
          # antes custa dois comandos.
          git rev-parse --show-toplevel >/dev/null 2>&1 \
            || { echo "ERRO: $(pwd) nao e um repositorio git."; exit 1; }
          test -f docker-compose.yml \
            || { echo "ERRO: nao ha docker-compose.yml em $(pwd)."; exit 1; }

          echo '>>> Buscando a versao nova'
          git fetch origin main
          # Atualiza o script de backup ANTES de executa-lo. Sem isto, uma
          # correcao no backup_db.sh so teria efeito no deploy SEGUINTE, ja que
          # o backup roda antes do reset. Pior: depois de um rollback o script
          # volta para a versao antiga do servidor e o problema reaparece - foi
          # exatamente o que travou dois deploys seguidos.
          git checkout origin/main -- scripts/backup_db.sh

          echo '>>> Backup (DB + media)'
          bash scripts/backup_db.sh

          echo '>>> Atualizando o codigo'
          git reset --hard origin/main
          SHA_CURTO="$(git rev-parse --short HEAD)"
          echo ">>> Versao alvo: ${SHA_CURTO} - $(git log -1 --format=%s)"

          echo '>>> Imagens de base (postgres, redis)'
          docker compose pull --ignore-pull-failures

          # Sem `--no-cache`. Ele rebaixava a imagem base do Playwright (~2 GB) e
          # reinstalava tudo a cada deploy, para resolver um problema que o cache
          # do Docker nao tem: se o requirements.txt muda, a camada muda junto. O
          # custo eram minutos de deploy e 2 GB de rede em toda subida.
          echo '>>> Build'
          docker compose build web worker worker_interativo beat

          # As migracoes rodam num container efemero da imagem NOVA, com o codigo
          # ANTIGO ainda servindo. Era o contrario: `up -d` -> `sleep 15` ->
          # `migrate`, ou seja, codigo novo conversando com schema antigo por uns
          # 15s em todo deploy. As migracoes da Fase 4 eram aditivas e passou
          # limpo; uma que renomeie coluna derruba o site nessa janela.
          #
          # De quebra, migracao que falha agora aborta o deploy com a versao
          # antiga intacta no ar, em vez de deixar codigo novo sobre um schema
          # pela metade.
          echo '>>> Migrations (imagem nova, antes de trocar o que esta no ar)'
          docker compose run --rm -T web python manage.py migrate --noinput

          echo '>>> Parando workers e beat antes de recriar'
          docker compose stop worker worker_interativo beat || true

          echo '>>> Subindo'
          docker compose up -d

          # Nao roda mais `collectstatic` aqui. O Dockerfile ja o executa no build
          # e falha se o staticfiles.json nao sair; STATIC_ROOT nao e volume, entao
          # o collectstatic num container em execucao se perdia na recriacao
          # seguinte. Era trabalho que nao persistia e ainda obrigava a esperar o
          # container subir para rodar.

          # -------------------------------------------------------------------
          # Validacao. HTTP sozinho nao basta: o site respondeu 200 durante um
          # deploy em que a coleta estava completamente parada.
          # -------------------------------------------------------------------
          echo '>>> Esperando o gunicorn responder'
          codigo=""
          for _ in $(seq 1 30); do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/healthz || true)"
            # 503 conta como "de pe": e a resposta correta com o Redis fora ou a
            # coleta atrasada, e o site continua funcionando. 301 tambem, caso o
            # SECURE_PROXY_SSL_HEADER nao esteja no .env. O que se mede aqui e se
            # o processo responde - a saude real vem no /healthz logo abaixo.
            case "$codigo" in 200|301|302|503) break ;; esac
            codigo=""
            sleep 2
          done

          if [ -z "$codigo" ]; then
            echo "ERRO: o gunicorn nao respondeu em 60s."
            docker compose ps
            docker compose logs web --tail 50
            exit 1
          fi
          echo ">>> gunicorn respondeu (HTTP ${codigo})"

          echo '>>> Servicos de pe'
          docker compose ps
          esperado=6
          # `ps -q` conta so o que esta rodando e existe em toda versao do
          # compose; `--status running --format '{{.Service}}'` seria mais
          # preciso, mas o template de Go no `ps` e recente demais para apostar
          # na versao instalada no servidor.
          de_pe="$(docker compose ps -q | grep -c . || true)"
          if [ "${de_pe:-0}" -ne "$esperado" ]; then
            echo "ERRO: ${de_pe:-0} de ${esperado} servicos rodando."
            docker compose logs --tail 30
            exit 1
          fi

          echo '>>> /healthz'
          curl -s --max-time 5 -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8000/healthz | head -c 400
          echo ""

          # Nao aborta: logo depois de subir, o worker devolve -1 (ainda nao rodou
          # task nenhuma) e o Beat so enfileira a coleta no proximo multiplo de 5.
          echo '>>> Heartbeat do worker (segundos desde a ultima task; -1 = ainda nao rodou)'
          docker compose exec -T worker python manage.py worker_heartbeat || true

          # -------------------------------------------------------------------
          # Marca as imagens com o SHA: serve para saber o que esta rodando e
          # para voltar em segundos, sem rebuild -
          #   docker tag smclab/web:<sha> smc_lab-web && docker compose up -d web
          # -------------------------------------------------------------------
          echo ">>> Marcando as imagens como ${SHA_CURTO}"
          for svc in web worker worker_interativo beat; do
            cid="$(docker compose ps -q "$svc" || true)"
            [ -n "$cid" ] || continue
            docker tag "$(docker inspect --format '{{.Image}}' "$cid")" \
              "smclab/${svc}:${SHA_CURTO}"
            # Guarda as 5 marcas mais recentes por servico; o `docker images` ja
            # lista da mais nova para a mais velha. Elas nao sao dangling, entao
            # o prune semanal nao as recolheria sozinho.
            docker images --filter "reference=smclab/${svc}" \
              --format '{{.Repository}}:{{.Tag}}' | tail -n +6 \
              | xargs -r docker rmi >/dev/null 2>&1 || true
          done

          echo '>>> Worker watchdog (reinicia worker se parar)'
          bash scripts/install_worker_watchdog.sh || true

          echo ">>> Deploy concluido: ${SHA_CURTO}"
          REMOTE

          # Rede de segurança para a classe de falha acima: um script que para no
          # meio sem erro não imprime o marcador final. Sem esta linha, o job
          # ficaria verde de novo — foi assim que o primeiro deploy deste
          # pipeline "passou" tendo feito só o backup.
          grep -q '>>> Deploy concluido:' "$saida" \
            || { echo "ERRO: o deploy terminou antes do fim do script."; exit 1; }
